<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The template's placeholder icon. Draw the app's own here, then `pnpm tauri:icons`
       regenerates every size the bundles need, and copy the 32, 256 and 512 px PNGs to
       apps/site/public as favicon-32x32.png, apple-touch-icon.png and icon-512.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66D18F"/>
      <stop offset="1" stop-color="#2E844D"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="300" y="250" width="424" height="524" rx="48" fill="#ffffff"/>
  <path d="M380 400 H644 M380 500 H644 M380 600 H540" stroke="#2E844D" stroke-width="44" stroke-linecap="round"/>
</svg>
