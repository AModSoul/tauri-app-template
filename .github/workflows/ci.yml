name: CI

on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git hooks are for local commits only.
  HUSKY: 0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # Ubuntu's mirrors are sometimes out of reach from a runner: retry, and give up in minutes
      # rather than waiting out the job.
      - name: Install the libraries Tauri builds against
        timeout-minutes: 10
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The desktop crate embeds apps/desktop/dist when it compiles.
      - run: pnpm --filter desktop build

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # core:rust:start
      - name: TypeScript bindings match the Rust types
        run: |
          pnpm bindings
          git diff --exit-code apps/desktop/src/bindings || (echo "Run pnpm bindings and commit the result." && exit 1)
      # core:rust:end

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --format github
      - run: pnpm format:check
      - run: pnpm typecheck

      # Unit tests, and every package's stories as browser tests in headless Chromium.
      - run: pnpm --filter desktop exec playwright install --with-deps chromium
      - run: pnpm test

      # The site's download page fetches the latest release as it's built; the token raises
      # GitHub's rate limit.
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
