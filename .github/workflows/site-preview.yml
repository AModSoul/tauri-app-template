# Deploys a pull request's site to a Cloudflare Pages preview, so a change to it can be seen
# before it's merged, and links the preview from the run's summary. Only for pull requests from
# this repository: a fork's has no access to the secrets.
name: Site preview

on:
  pull_request:
    paths:
      - apps/site/**
      - packages/ui/**
      - docs/screenshots/**
      - .github/workflows/site-preview.yml
  workflow_dispatch:

concurrency:
  group: site-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0
  PROJECT: my-app-site

jobs:
  preview:
    name: Build and deploy a preview
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter site build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy the preview
        id: deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, so there's no preview."
            exit 0
          fi
          # Pages names a preview after its branch, lower case, other characters as dashes.
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-28)
          pnpm exec wrangler pages deploy dist --project-name "$PROJECT" --branch "$alias" \
            --commit-hash "$(git rev-parse HEAD)" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "alias=https://$alias.$PROJECT.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Write summary
        if: steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
        run: |
          {
            echo "### Site preview"
            echo
            echo "- This build: $URL"
            echo "- The branch's latest: $ALIAS"
          } >> "$GITHUB_STEP_SUMMARY"
