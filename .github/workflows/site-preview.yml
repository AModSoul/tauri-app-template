# Uploads a pull request's site, with its Worker, as a preview version of the Worker, so a change
# to it can be seen before it's merged, and links the preview from the run's summary. The live
# site isn't touched: a version only goes live when it's deployed. Only for pull requests from
# this repository, since a fork's has no access to the secrets, and only once the Worker exists
# (after the first deploy from trunk).
name: Site preview

on:
  pull_request:
    paths:
      - apps/site/**
      - packages/ui/**
      - docs/screenshots/**
      - .github/workflows/site-preview.yml
  workflow_dispatch:

concurrency:
  group: site-preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  preview:
    name: Build and upload a preview
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter site build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the preview
        id: upload
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          # Wrangler adds one ND-JSON record per command to this file; the "version-upload"
          # record has the preview's addresses.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret, so there's no preview."
            exit 0
          fi
          # A preview alias is lower case letters, digits and dashes.
          alias=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-32)
          pnpm exec wrangler versions upload --preview-alias "$alias" \
            --message "$(git log -1 --format='%h %s')"
          node -e '
            const fs = require("node:fs");
            const record = fs
              .readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, "utf8")
              .split("\n")
              .filter(Boolean)
              .map((line) => JSON.parse(line))
              .findLast((entry) => entry.type === "version-upload");
            if (!record) throw new Error("wrangler wrote no version-upload record");
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `url=${record.preview_url ?? ""}\nalias=${record.preview_alias_url ?? ""}\n`,
            );
          '

      - name: Write summary
        if: steps.upload.outputs.url != '' || steps.upload.outputs.alias != ''
        env:
          URL: ${{ steps.upload.outputs.url }}
          ALIAS: ${{ steps.upload.outputs.alias }}
        run: |
          {
            echo "### Site preview"
            echo
            echo "- This version: $URL"
            echo "- The branch's latest: $ALIAS"
          } >> "$GITHUB_STEP_SUMMARY"
