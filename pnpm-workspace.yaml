packages:
  - apps/*
  - packages/*

# One version of each shared dependency for every package. A package asks for
# one with `"react": "catalog:"`.
catalog:
  "@chakra-ui/cli": ^3.38.0
  "@chakra-ui/react": ^3.38.0
  "@emotion/react": ^11.14.0
  "@fontsource-variable/inter": ^5.3.0
  "@storybook/addon-a11y": ^10.6.6
  "@storybook/addon-docs": ^10.6.6
  "@storybook/addon-mcp": ^10.6.6
  "@storybook/addon-themes": ^10.6.6
  "@storybook/addon-vitest": ^10.6.6
  "@storybook/react-vite": ^10.6.6
  "@types/node": ^26.6.6
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  "@vitest/browser-playwright": ^5.1.0
  next-themes: ^0.4.6
  playwright: ^1.65.0
  react: ^19.3.1
  react-dom: ^19.3.1
  react-icons: ^5.7.0
  storybook: ^10.6.6
  typescript: ^6.0.3
  vite: ^8.3.6
  vitest: ^5.1.0

allowBuilds:
  esbuild: true
  # Wrangler's local runtime; only `wrangler dev` runs it, and the site only deploys.
  workerd: false
